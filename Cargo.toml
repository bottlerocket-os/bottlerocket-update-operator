[workspace]
members = [
    "agent",
    "apiserver",
    "controller",
    "models",
    "deploy",
    "integ",
]

[workspace.lints.clippy]
# tracing::instrument macro unhelpfully triggers this clippy warning
blocks_in_conditions = "allow"

[workspace.dependencies]
argh = "0.1"
async-trait = "0.1"
awc = "3"
aws-config = { version = "1", default-features = false, features = ["credentials-process", "default-https-client", "rt-tokio"] }
aws-lc-rs = { version = "1", features = ["bindgen"] }
aws-sdk-ec2 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-eks = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
console_log = { version = "1", features = ["color"] }
cron = "0.15"
env_logger = "0.11"
futures = "0.3"
governor = "0.8"
hex ="0.4"
insta = { version = "1", features = ["yaml"] }
lazy_static = "1"
log = "0.4"
http = "1"
maplit = "1"
mockall = { version = "0.13" }
nonzero_ext = "0.3"

# actix & opentelemetry dependencies
# these package versions should be moved in lockstep to match upstream
actix-web = { version = "4.9", features = ["rustls-0_23"] }
tracing-actix-web = "0.7"
opentelemetry-instrumentation-actix-web = { version = "0.22", features = ["metrics"] }

# opentelemetry dependencies
opentelemetry = { version = "0.29", features = ["metrics"]}
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio-current-thread", "metrics"]}
opentelemetry-prometheus = "0.29"
prometheus = "0.14"

# k8s-openapi must match the version required by kube and enable a k8s version feature
k8s-openapi = { version = "0.21", default-features = false, features = ["v1_24"] }
kube = { version = "0.88", default-features = false, features = [ "derive", "runtime", "rustls-tls" ] }

regex = "1"
reqwest = { version = "0.12", default-features = false, features =  [ "json", "rustls-tls" ] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-pemfile = { version = "2" }
schemars = "0.8"
semver = "1"
serde = "1"
serde_json = "1"
serde_plain = "1"
serde_yaml = "0.9"
snafu = "0.8"
strum_macros = "0.24"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-retry = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter", "json"] }
uuid = { version = "1", default-features = false, features = ["serde", "v4"] }
validator = { version = "0.20", features = ["derive"] }
webpki = { version = "0.22", features = ["std"] }
